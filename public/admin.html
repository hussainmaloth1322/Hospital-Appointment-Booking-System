
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Doctors | CityCare Hospital</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="site-header">

        <a class="brand" href="/">
            <span class="brand-mark">✚</span>

            <span>
                <strong>CityCare Hospital</strong>
                <small>Your Health Our Priority</small>
            </span>
        </a>

        <button
            class="menu-toggle"
            id="menu-toggle"
            aria-label="Toggle navigation">
            ☰
        </button>

        <!-- NAVIGATION -->
        <nav class="navlinks" id="main-nav">

            <a href="/">
                ⌂ <span>Home</span>
            </a>

            <a class="active" href="/doctors.html">
                ♧ <span>Doctors</span>
            </a>

            <a href="/appointments.html">
                ▦ <span>Book Appointment</span>
            </a>

            <a href="/appointments.html">
                ☑ <span>My Appointments</span>
            </a>

            <a href="/login.html">
                ♟ <span>Login</span>
            </a>

            <a href="/register.html">
                ▣ <span>Register</span>
            </a>

        </nav>

    </header>

    <!-- MAIN CONTENT -->
    <main class="container">

        <!-- PAGE HEADING -->
        <section class="section-heading left">

            <p class="eyebrow">CITYCARE HOSPITAL</p>

            <h1>Meet Our Expert Doctors</h1>

            <p>
                Find the right specialist for your healthcare needs.
            </p>

        </section>

        <!-- DOCTOR SEARCH -->
        <form id="doctor-search-form" class="searchbar">

            <label class="sr-only" for="specialization">
                Specialization
            </label>

            <input
                id="specialization"
                placeholder="Search by specialization..."
                aria-label="Specialization">

            <button class="button" type="submit">
                Search Doctors
            </button>

            <button
                id="clear-search"
                class="button button-secondary"
                type="button">
                Show all
            </button>

        </form>

        <!-- MESSAGE -->
        <p
            id="message"
            class="message"
            role="status">
        </p>

        <!-- DOCTOR RESULTS -->
        <section
            id="doctor-results"
            class="cards">
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="site-footer">

        <a class="footer-brand" href="/">

            <span class="footer-mark">✚</span>

            <span>
                <strong>CityCare Hospital</strong>
                <small>Your Health Our Priority</small>
            </span>

        </a>

        <div class="footer-links">

            <a href="/">Home</a>

            <a href="/appointments.html">Appointments</a>

            <a href="/register.html">Register</a>

        </div>

    </footer>

    <!-- JAVASCRIPT -->
    <script src="/js/app.js"></script>

    <script>

        // Read specialization from URL
        const params = new URLSearchParams(window.location.search);

        const specialization = params.get("specialization");

        // Automatically search if specialization exists
        if (specialization) {

            document.getElementById("specialization").value =
                specialization;

            document.getElementById("doctor-search-form")
                .dispatchEvent(
                    new Event("submit", {
                        cancelable: true
                    })
                );

        }

    </script>

</body>
</html>
