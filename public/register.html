<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Patient Registration</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <nav class="nav">
        <a class="brand" href="/">HealthConnect</a>
        <div class="navlinks">
            <a href="/doctors.html">Doctors</a>
            <a href="/login.html">Login</a>
        </div>
    </nav>

    <main class="container narrow">
        <section class="panel">
            <p class="eyebrow">PATIENT ACCOUNT</p>
            <h1>Create your account</h1>
            <p class="muted">Register to book and manage appointments.</p>

            <form id="register-form" class="form">
                <label for="name">Full name</label>
                <input id="name" name="name" required minlength="2"
                    placeholder="Your full name">

                <label for="email">Email address</label>
                <input id="email" name="email" type="email" required
                    placeholder="you@example.com">

                <label for="password">Password</label>
                <input id="password" name="password" type="password"
                    required minlength="8" placeholder="At least 8 characters">

                <button id="register-button" class="button" type="submit">
                    Register
                </button>

                <p id="message" class="message" role="status"></p>
            </form>

            <p>Already registered? <a href="/login.html">Patient login</a></p>
        </section>
    </main>

    <script src="/js/app.js"></script>

    <script>
        const registerForm = document.getElementById("register-form");

        registerForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            // Your existing registration logic runs from app.js.
        });
    </script>
</body>
</html>
